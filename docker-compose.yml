version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: smarttask_postgres
    environment:
      POSTGRES_DB: smarttask_db
      POSTGRES_USER: smarttask_user
      POSTGRES_PASSWORD: smarttask_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  smarttask-api:
    build: .
    container_name: smarttask_api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smarttask_db
      SPRING_DATASOURCE_USERNAME: smarttask_user
      SPRING_DATASOURCE_PASSWORD: smarttask_pass
    depends_on:
      - postgres

volumes:
  postgres_data:
